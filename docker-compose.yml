# docker-compose.yml — genere par Code Auditor
# Utilisez les variables d'environnement pour personnaliser
services:
  app:
    image: ${DOCKERHUB_USERNAME:-votre-login}/${APP_NAME:-python_test}:latest
    ports:
      - "8000:8000"
    restart: unless-stopped
    environment:
      - NODE_ENV=production
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
